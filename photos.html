<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景点照片库 · TripGuessr</title><link rel="stylesheet" href="styles.css"></head><body class="photo-body"><main class="library"><header class="library-head"><a class="brand" href="index.html">Trip<span>.</span>com</a><a href="index.html">返回交互原型 ↗</a></header><span class="pill">TRIPGUESSR · 内容资产</span><h1 style="margin-top:18px">每一处风景，都有自己的位置。</h1><p class="library-intro">按「目的地 / 景点」管理原始照片。每个景点仅使用一张图片，保留原始分辨率；本次探索采用 3 张大同高清竖图。竖屏比例以宽:高计算，为 3:4 至 9:16。</p><div class="library-toolbar" aria-label="照片状态筛选"></div><div class="photo-grid"></div><footer class="library-footer">目录结构：photo-library / 城市 / 景点 / original.jpg<br>索引信息见 data.js；可用素材短边均超过 1080 像素，展示仅使用 CSS 适配，不修改原片。<br>照片由用户提供，未独立验证拍摄权属。城墙截图和应县木塔作为储备保存，不纳入本次大同关卡。</footer></main><script src="data.js"></script><script>const filters=['全部','已采用','待替换','周边储备'];function renderLibrary(filter='全部'){document.querySelector('.library-toolbar').innerHTML=filters.map(f=>`<button class="${f===filter?'active':''}" data-filter="${f}">${f} · ${PHOTOS.filter(p=>f==='全部'||p.status===f).length}</button>`).join('');document.querySelector('.photo-grid').innerHTML=PHOTOS.filter(p=>filter==='全部'||p.status===filter).map(p=>`<article class="photo-card"><div class="photo-preview"><img src="${p.src}" alt="${p.name}" loading="lazy"></div><div class="details"><span class="pill">${p.city} · ${p.status}</span><h2>${p.name}</h2><p>${p.width} × ${p.height} px<br>${p.note}</p><code>${p.src}</code><br><a href="${p.src}" target="_blank" rel="noopener">查看原始照片 ↗</a></div></article>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b)renderLibrary(b.dataset.filter)});renderLibrary();</script></body></html>
