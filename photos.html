<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景点照片库 · TripWonder</title><link rel="stylesheet" href="styles.css?v=20260924-five1"><style>
.library-filter{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin:16px 0 20px}.library-filter button{white-space:nowrap;border:1px solid #dae4f3;border-radius:19px;padding:8px 14px;background:#fff;font-size:12px}.library-filter button.active{background:#3264ff;border-color:#3264ff;color:#fff}.photo-card .details{padding:15px 18px}.photo-card .details a{margin:4px 10px 0 0}.photo-card .details p{margin:8px 0}.library-source{font-size:11px;line-height:1.6;color:#74849a}.library-source a{font-size:11px!important}.photo-preview img{object-fit:cover}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:800px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){.photo-grid{grid-template-columns:1fr}}
</style></head>
<body class="photo-body"><main class="library"><header class="library-head"><a class="brand" href="index.html">Trip<span>.</span>com</a><a href="index.html">返回原型 ↗</a></header><span class="pill">TRIPWONDER · 照片资产</span><h1 style="margin-top:18px">景点照片库</h1><p class="library-intro">按目的地和景点保存照片。每景只使用一张照片，探索页优先加载 WebP 展示版；原始文件或来源预览、作者与许可见下方及各城市清单。</p><div class="library-filter" aria-label="筛选目的地"></div><div class="photo-grid"></div><footer class="library-footer">照片目录：photo-library / 目的地 / 景点。展示版宽度优先 1080 像素以上，比例介于 3:4 与 9:16；完整原片未取得的景点已在各城市清单里明确标注。大同照片由用户提供，拍摄权属未独立验证。<br>素材署名：<a href="photo-library/shenzhen/ATTRIBUTION.md">深圳</a> · <a href="photo-library/suzhou/SOURCES.md">苏州</a> · <a href="photo-library/guilin/ATTRIBUTION.md">桂林</a> · <a href="photo-library/hongkong/ATTRIBUTION.md">香港</a></footer></main>
<script src="data.js?v=20260924-five1"></script><script src="media-manifest.js?v=20260924-five1"></script><script src="content/shenzhen.js?v=20260926-seven2"></script><script src="content/suzhou.js?v=20260926-seven2"></script><script src="content/guilin.js?v=20260926-seven2"></script><script src="content/hongkong.js?v=20260926-seven2"></script><script src="content/beijing.js?v=20260926-seven2"></script><script src="content/shanghai.js?v=20260926-seven2"></script><script src="catalog.js?v=20260926-seven1"></script>
<script>
const catalog=window.TRIPWONDER_CATALOG,escapeText=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const licenseUrl=photo=>photo.licenseUrl||(photo.license==='CC0 1.0'?'https://creativecommons.org/publicdomain/zero/1.0/':photo.license==='CC BY-SA 4.0'?'https://creativecommons.org/licenses/by-sa/4.0/':photo.license==='CC BY-SA 3.0'?'https://creativecommons.org/licenses/by-sa/3.0/':photo.license==='CC BY 4.0'?'https://creativecommons.org/licenses/by/4.0/':photo.license==='CC BY 2.0'?'https://creativecommons.org/licenses/by/2.0/':'');
let filter='all';function renderLibrary(){document.querySelector('.library-filter').innerHTML=[['all','全部'],...catalog.cities.map(c=>[c.id,c.name])].map(([id,label])=>`<button class="${id===filter?'active':''}" data-filter="${id}">${label}</button>`).join('');document.querySelector('.photo-grid').innerHTML=catalog.cities.filter(c=>filter==='all'||c.id===filter).flatMap(c=>c.scenes.map(scene=>{const p=scene.photo,thumb=p.thumb?.src||window.MEDIA_ASSETS[p.id]?.thumb?.src||p.src,source=p.source?.startsWith('http')?`<a href="${escapeText(p.source)}" target="_blank" rel="noopener noreferrer">素材来源 ↗</a>`:'',license=licenseUrl(p);return `<article class="photo-card"><div class="photo-preview"><img src="${escapeText(thumb)}" width="${p.thumb?.width||p.width}" height="${p.thumb?.height||p.height}" alt="${escapeText(scene.name)}" loading="lazy" decoding="async"></div><div class="details"><span class="pill">${escapeText(c.name)}</span><h2>${escapeText(scene.name)}</h2><p>展示版 ${p.width} × ${p.height} px · ${p.credit?escapeText(p.credit):'用户提供'}${p.license?` · <a href="${escapeText(license)}" target="_blank" rel="noopener noreferrer">${escapeText(p.license)}</a>`:''}</p><div class="library-source"><a href="${escapeText(p.sourceOriginal||p.src)}" target="_blank" rel="noopener noreferrer">查看原始素材或来源预览 ↗</a>${source}</div></div></article>`;})).join('');}
document.addEventListener('click',event=>{const b=event.target.closest('[data-filter]');if(b){filter=b.dataset.filter;renderLibrary();}});renderLibrary();
</script></body></html>
