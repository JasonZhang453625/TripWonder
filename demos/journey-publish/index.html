edia(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:370px){.page{padding-left:14px;padding-right:14px}.glass{padding:16px}.switch button{padding:6px 7px}}

<section class="glass" id="photos"><div class="heading"><div><div class="eyebrow">THE TRAVEL ALBUM</div><h2>你的旅行相册</h2></div><span class="count" id="count">3 / 9 张</span></div><div class="album" id="album"></div><button class="upload" id="upload">＋ 添加旅行照片</button><input type="file" accept="image/*" multiple hidden id="files"><div class="album-foot"><span class="muted">第一张为封面 · 选择 3–9 张</span><button class="text-button" id="rotate">调整封面 ↻</button></div></section>
<section class="glass" id="place"><div class="eyebrow">A PLACE WORTH SHARING</div><h2>风景背后的地点</h2><label class="field">地点名称 · 谜底<input id="placeName" value="漓江" placeholder="你想分享的地点"></label><label class="field">挑战标题<input id="challengeTitle" value="山水之间，寻找一叶轻舟" placeholder="用一句话吸引旅人，不要透露地名"></label><label class="field">所在城市<input id="city" value="广西 · 桂林" placeholder="选择所在城市"></label><label class="field">一句旅行介绍<textarea id="intro">山影落在水里，竹筏划开清晨。来看看，你能认出这片风景吗？</textarea></label><p class="tip">⌖ 正式接入后将根据地点匹配位置，无需填写经纬度。</p></section><div class="questions-title" id="questions"><h2>设置三道题</h2></div><div id="questionList"></div><p class="demo-label">视觉交互 Demo · AI 使用示例内容 · 不会实际发布</p></main><footer class="footer"><small id="save">○ 本次试玩内容</small><div><button class="btn" id="preview">预览</button><button class="btn primary" id="submit">提交审核</button></div></footer><dialog id="dialog"><div id="dialogContent"></div><button class="btn primary" style="margin-top:15px;width:100%" onclick="document.querySelector('dialog').close()">返回编辑</button></dialog><script>
const photos=[{src:'../../photo-library/guilin/yulong/screen.webp'},{src:'../../photo-library/zhangjiajie/misty-peaks/screen.webp'},{src:'../../photo-library/suzhou/shantang/screen.webp'}];const qs=Array.from({length:3},()=>({mode:'ai',ready:false,q:'',options:['','','',''],answer:0,explain:''}));
function renderPhotos(){const album=document.querySelector('#album');album.replaceChildren();photos.forEach((p,i)=>{const item=document.createElement('div');item.className='photo '+(i===0?'cover':'small');const img=document.createElement('img');img.src=p.src;img.alt='旅行照片 '+(i+1);item.append(img);if(i===0){const b=document.createElement('span');b.className='badge';b.textContent='封面';item.append(b)}const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','删除第'+(i+1)+'张照片');del.onclick=()=>{photos.splice(i,1);renderPhotos()};item.append(del);album.append(item)});document.querySelector('#count').textContent=photos.length+' / 9 张'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderQ(i){const s=qs[i],el=document.querySelector('#q'+i);el.innerHTML=`<div class="qhead"><span class="number">QUESTION 0${i+1}</span><div class="switch"><button class="${s.mode==='ai'?'active':''}" data-mode="ai">✧ AI生成</button><button class="${s.mode==='manual'?'active':''}" data-mode="manual">自己出题</button></div></div><div class="qbody">${s.mode==='ai'&&!s.ready?'<div class="ai-intro"><span class="spark">✧</span><p>从旅行照片中，发现一道有趣的问题</p><button class="generate">生成此题 · 示例</button></div>':`<label class="question-prompt"><input aria-label="题目" data-field="q" placeholder="请输入你的问题" value="${esc(s.q)}"></label><p class="answer-label">选择正确答案</p><div class="options">${s.options.map((o,j)=>`<label class="option"><input type="radio" name="answer${i}" value="${j}" ${s.answer===j?'checked':''}><span>${'ABCD'[j]}</span><input type="text" aria-label="选项${'ABCD'[j]}" data-option="${j}" placeholder="输入选项" value="${esc(o)}"></label>`).join('')}</div><label class="field">答案解析 · 可选<input data-field="explain" placeholder="分享一点风景背后的知识" value="${esc(s.explain)}"></label>${s.mode==='ai'?'<div class="qactions"><button class="text-button generate">↻ 重新生成示例</button></div>':''}`}</div>`;el.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',s.mode===b.dataset.mode);b.onclick=()=>{s.mode=b.dataset.mode;renderQ(i)}});el.querySelector('.generate')?.addEventListener('click',()=>{s.ready=true;const samples=[['照片中常见的水上交通工具是什么？',['竹筏','游艇','帆船','轮渡'],'竹筏是这片山水里很有代表性的景物。'],['远处山峰最明显的外形特点是什么？',['尖耸连绵','平坦宽阔','被雪覆盖','火山口状'],'观察山峰轮廓，就能找到线索。'],['照片里的建筑主要临水分布在哪里？',['河岸两侧','山顶','沙漠中','海面上'],'沿河而建的街巷，构成了独特的水乡景观。']][i];s.q=samples[0];s.options=[...samples[1]];s.explain=samples[2];s.answer=0;renderQ(i);toast('已载入示例题目，未调用真实 AI')});el.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{if(input.dataset.field)s[input.dataset.field]=input.value;else if(input.dataset.option!==undefined)s.options[+input.dataset.option]=input.value;else if(input.type==='radio')s.answer=+input.value;document.querySelector('#save').textContent='✓ 本次修改已保留'}))}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)}
qs.forEach((_,i)=>{const el=document.createElement('section');el.className='glass';el.id='q'+i;document.querySelector('#questionList').append(el);renderQ(i)});document.querySelector('#q0 .generate').click();renderPhotos();document.querySelector('#upload').onclick=()=>document.querySelector('#files').click();document.querySelector('#files').onchange=e=>{const f=[...e.target.files].filter(f=>f.type.startsWith('image/'));const space=9-photos.length;f.slice(0,space).forEach(f=>photos.push({src:URL.createObjectURL(f)}));renderPhotos();if(f.length>space)toast('最多可添加9张照片');e.target.value=''};document.querySelector('#rotate').onclick=()=>{if(photos.length>1){photos.push(photos.shift());renderPhotos()}};document.querySelector('#preview').onclick=()=>{const c=document.querySelector('#dialogContent');c.replaceChildren();if(photos[0]){const img=document.createElement('img');img.src=photos[0].src;img.alt='挑战封面';c.append(img)}const h=document.createElement('h2');h.textContent=document.querySelector('#challengeTitle').value||'未命名挑战';c.append(h);const p=document.createElement('p');p.className='muted';p.textContent=document.querySelector('#intro').value;c.append(p);const n=document.createElement('p');n.textContent='已准备 '+qs.filter(q=>q.q.trim()&&q.options.every(o=>o.trim())).length+' / 3 道题 · '+photos.length+' 张照片';c.append(n);document.querySelector('#dialog').showModal()};document.querySelector('#submit').onclick=()=>{const missing=qs.findIndex(q=>!q.q.trim()||!q.options.every(o=>o.trim()));if(photos.length<3)return toast('请至少保留3张照片');if(!document.querySelector('#placeName').value.trim()||!document.querySelector('#challengeTitle').value.trim()||!document.querySelector('#city').value.trim())return toast('请完善地点、标题和城市');if(missing!==-1){document.querySelector('#q'+missing).scrollIntoView({behavior:'smooth',block:'center'});return toast('请先完成第'+(missing+1)+'道题')}toast('Demo 校验通过；未提交到服务器')};
